[package]
name = "mcl-client"
default-run = "mcl-client"
version = "0.10.2"
description = "Custom Minecraft Launcher with high performance optimization, direct server connection, and unified profile management."
authors = ["pecora31"]
license = "GPL-3.0"
repository = "https://github.com/pecora31/MCL-Client"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
walkdir = "2.5"
zip = "2.2"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
rfd = "0.17.2"
base64 = "0.22"
sysinfo = "0.32"
discord-rich-presence = "1.1.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
toml = "1.0.7"
iroh = { version = "0.33", optional = true }
# ring instead of russh's default aws-lc-rs backend: aws-lc-sys needs NASM to build on Windows.
russh = { version = "0.63", optional = true, default-features = false, features = ["ring", "flate2", "rsa"] }
axum = { version = "0.7", optional = true }
axum-server = { version = "0.7", optional = true, features = ["tls-rustls"] }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws-lc-rs"] }
rand = "0.8"
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tower-http = { version = "0.6", optional = true, features = ["cors"] }

[target.'cfg(windows)'.dependencies]
# Only the agent binary uses this (registering itself as a Windows Service). Optional and
# gated through the "agent" feature below (Cargo's dep: feature syntax is target-aware, so
# this has no effect at all when building for a non-Windows target).
windows-service = { version = "0.7", optional = true }

[dev-dependencies]
# Only for remote_agent.rs's test, which spins up a throwaway TLS server to prove the
# certificate-pinning path actually rejects an unpinned client — never shipped in the app.
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[features]
# On for every desktop build; the agent turns it off (--no-default-features) because it never
# hosts peer-to-peer rooms and iroh alone accounts for roughly 190 transitive crates in the
# one binary that actually runs exposed on a VPS.
default = ["p2p", "remote-setup"]
p2p = ["dep:iroh"]
remote-setup = ["dep:russh"]

# The agent binary is a separate, opt-in build: the desktop app never links axum, and a
# plain `cargo build`/`cargo tauri build` for the launcher does not need it resolved.
agent = ["dep:axum", "dep:axum-server", "dep:rcgen", "dep:rustls", "dep:tokio-stream", "dep:tower-http", "dep:windows-service"]

[[bin]]
name = "mcl-client"
path = "src/main.rs"

[[bin]]
name = "mcl-agent"
path = "src/bin/mcl_agent.rs"
required-features = ["agent"]

# Release builds are what players install: link-time optimization across crates and a single
# codegen unit trade a slower build for a smaller, faster binary, and stripping drops the
# debug symbols no player needs.
[profile.release]
lto = true
codegen-units = 1
strip = true

