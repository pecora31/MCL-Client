[package]
name = "mcl-client"
version = "0.2.1"
description = "Custom Minecraft Launcher with high performance optimization, direct server connection, and unified profile management."
authors = ["pecora31"]
license = "GPL-3.0"
repository = "https://github.com/pecora31/MCLv2"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha1 = "0.10"
walkdir = "2.5"
zip = "2.2"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
rfd = "0.17.2"
base64 = "0.22"

