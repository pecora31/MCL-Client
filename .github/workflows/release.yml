name: Release

# Pushing a version tag is the whole release process: this builds the installer,
# publishes it, and writes the latest.json the in-app updater reads.
on:
  push:
    tags:
      - 'v*'
  # Lets a release be rebuilt from the Actions tab without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # Matches the platform the launch pipeline targets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The release notes are read out of the tag's own message, which a shallow
          # checkout does not carry.
          fetch-depth: 0

      # What the release page says about this version. Writing it into the tag keeps the
      # notes with the thing they describe:
      #   git tag -a v0.4.0 -m "Summary" -m "- first change" -m "- second change"
      - name: Read the release notes from the tag
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          # A lightweight tag carries no message, so fall back rather than publishing blank
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Installers are attached below. Existing installs update themselves."
          fi
          {
            # Just what was written in the tag — used as-is for the Discord announcement,
            # which adds its own link and footer rather than repeating the installer line.
            echo "raw<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"

            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo "Installers are attached below. Existing installs update themselves."
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fails the release before anything is published rather than shipping a build
      # that does not compile cleanly.
      - name: Check
        run: |
          npx tsc -b
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundle is unsigned and every existing install would
          # refuse the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MCL Client __VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published straight away: a draft release has no latest.json for the
          # updater to read, so a forgotten draft looks like updates are broken.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Posts the same notes written into the tag straight to Discord. Skipped rather than
      # failed when no webhook is configured, so a fork or a repo without one still releases.
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.raw }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) {
            Write-Host "DISCORD_WEBHOOK_URL not set, skipping Discord announcement."
            exit 0
          }

          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
          $payload = @{
            embeds = @(@{
              title       = "MCL Client $env:RELEASE_TAG"
              url         = $releaseUrl
              description = $env:RELEASE_NOTES
              color       = 5793266
              footer      = @{ text = "Download from the Releases page — existing installs update themselves." }
            })
          } | ConvertTo-Json -Depth 5

          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
              -ContentType 'application/json; charset=utf-8' `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
          } catch {
            # The release itself already succeeded and is already published; a Discord
            # hiccup should be visible in the log, not turn a good release red.
            Write-Warning "Discord announcement failed: $_"
          }
