name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typechecks and bundles, so a missing asset or bad import fails here
      - name: Build
        run: npm run build
      - name: Lint
        run: npx oxlint

  backend:
    # Matches the platform the launch pipeline currently targets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
